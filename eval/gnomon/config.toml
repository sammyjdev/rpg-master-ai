# GNOMON run config for RPG_MASTER's live OpenAI-compat endpoint.
# Field shape mirrors ~/dev/gnomon-eval/src/gnomon/config/run_config.py
# (RunConfig / TargetConfig / JudgeConfig / GateConfig) verbatim — not the
# {question, reference_answer} / [dataset] sketch from the task brief, which
# does not match GNOMON's actual schema.
#
# dataset_path is resolved relative to the CWD gnomon is invoked from — run
# gnomon from this directory (see ../README.md), not from ~/dev/gnomon-eval.
dataset_path = "dataset.json"

[eval]
reproducible = true
seed = 42
judge_runs = 8
confidence_level = 0.95

[target]
kind = "openai_compat"
base_url = "http://localhost:8080/v1"
model = "all-rulebooks"
# contexts_field left explicit even though it matches OpenAICompatTarget's
# own default ("contexts") — RPG_MASTER's OpenAiCompatibleController now
# emits both top-level "contexts" and "usage.total_tokens" in its
# chat/completions response, resolving the gap previously noted here.
contexts_field = "contexts"

[judge]
provider = "ollama"
model = "llama3.1:8b"
base_url = "http://<judge-host>:11434"

[gate]
# Record-only on this first wiring — no build should fail on these yet.
faithfulness = 0.0
context_precision = 0.0
